[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "techtransdetection"
version = "0.1.0"
description = "Reproducible text-based detection of technological transitions from patent corpora"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ming Chen"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "hdbscan>=0.8.40,<1",
]

[project.optional-dependencies]
topic-modeling = [
  "bertopic>=0.16,<1",
  "sentence-transformers>=3,<6",
  "umap-learn>=0.5.6,<1",
  "spacy>=3.7,<4",
]
api = ["openai>=1.50,<3"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
